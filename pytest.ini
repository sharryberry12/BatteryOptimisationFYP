# -p no:faulthandler: dss-python's FreePascal-compiled engine raises a
# handled SEH exception (0xe0465043) while its DLL loads; pytest's default
# faulthandler prints it as a scary-but-benign "Windows fatal exception".
# The exception is caught inside the DLL and does not affect results.
[pytest]
testpaths = tests
addopts = -p no:faulthandler
